name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore optional display measurements
        run: node scripts/restore-display-data.mjs
        env:
          AA_DISPLAY_DATA_GZIP_BASE64: ${{ secrets.AA_DISPLAY_DATA_GZIP_BASE64 }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
