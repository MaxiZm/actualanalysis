  - model_id: muse-spark-1.1
    benchmark_id: osworld-2.0
    source_id: vendor-model-cards
    score: 14.2
    score_unit: percent
    config: { reasoning_effort: "xhigh", metric: "binary completion" }
    n_items: 108
    observed_on: 2026-07-09
    url: https://ai.meta.com/static-resource/muse-spark-1-1-evaluation-report/
    provenance: self_report
    notes: >-
      Meta reports both strict binary completion and partial-credit mean reward
      as "primary metrics"; this row is the binary completion rate over 108
      long-horizon workflows. Superseded by the 2026-09-05 coverage audit: The
      Muse Spark 1.1 evaluation report is dated July 9, 2026, and therefore
      predates the registered August 8 OSWorld 2.0 task release. The report
      describes 108 workflows, GUI-only use, 500 steps, batched actions, xhigh
      reasoning and strict binary completion alongside partial reward, but does
      not explicitly pin June 24 or a grader revision. Preserve the claimed
      14.2% as unverified-version audit evidence; exclude it from the August
      condition and from fitting. Do not infer a precise June release from the
      report date.
    sample_only: true
