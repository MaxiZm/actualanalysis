  # --- Vending-Bench 2 (vending-bench-2) ---
  # Epoch AI's benchmark page (https://epoch.ai/benchmarks/vending-bench-2) states its
  # methodology as "We source results from the public Vending-Bench 2 leaderboard" at
  # https://andonlabs.com/evals/vending-bench-2, but the epoch.ai page itself renders the
  # leaderboard table client-side and does not embed any scores in its HTML/JSON (verified:
  # no leaderboard data present in page source or in epoch.ai's public eci_benchmarks.csv).
  # Contrary to the brief's expectation, andonlabs.com did NOT block this fetch: its "Current
  # leaderboard" table (Frontier tab, "Average across 5 runs" secondary label, per-row run
  # counts vary 4-6) is server-rendered HTML with model name, money-balance score, and an
  # explicit "Standard error of the mean across N runs" figure per row - used directly as se
  # (no half-width conversion needed, it is already an SE). Recorded against the direct
  # Andon Labs runner source; Epoch's page is useful corroboration but does not license or
  # originate these values.
  - model_id: claude-opus-5
    benchmark_id: vending-bench-2
    source_id: andonlabs
    score: 11181.87
    score_unit: currency
    se: 2094
    k_trials: 6
    observed_on: 2026-09-04
    url: https://andonlabs.com/evals/vending-bench-2
    provenance: independent
    notes: >-
      Rank 1 on Andon Labs' public Vending-Bench 2 "Frontier" leaderboard (final money
      balance, USD, averaged across 6 runs; se is the page's own "standard error of the
      mean" figure). Origin/benchmark creator: Andon Labs. The observation comes directly
      from Andon Labs; Epoch AI's benchmark page corroborates that it uses the same public
      leaderboard but does not originate or license this value.

