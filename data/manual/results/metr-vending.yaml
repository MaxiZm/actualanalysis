  # Audit-only fallback copy. These rows are intentionally sample_only: their legacy SE values were
  # computed on the raw-minute scale and their config keys do not match the live adapter. Production
  # scoring uses the live METR adapter, which converts CI width in log2 space with a delta-method SE
  # and emits the canonical { quantile: p50 } config.
  # harness = "Inspect" for all rows: every matched entry's scaffolds use metr_agents/react or
  # triframe_inspect/triframe_agent, both run under METR's Inspect-based evaluation harness
  # (the successor to the older Vivaria harness used for pre-2024 models, none of which are in
  # scope here).
