  terminal, edit, and test tools. The native source reports the selected task
  window and agentVersion tools but does not pin the grader or harness commit
  or identify a V1/V2 revision; these fields remain metadata_incomplete.
promotion_rule: Active for independently measured model runs in this exact
  common task window and tools scaffold. Standalone agent products, other
  task windows, and unversioned aggregates are not interchangeable observations.
