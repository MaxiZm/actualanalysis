notes: Research-level physics challenge accuracy. Artificial Analysis reports mean pass@1 over five repeats of 70 questions, using a reasoning step followed by answer formatting for the official grader. These are 70 distinct questions, not 350 independent items. Current attributed AA results are displayed from the isolated non-redistributable overlay and are not fitted into the public index. Domain shares are the project’s declared interpretation of scientific reasoning and physics knowledge.
